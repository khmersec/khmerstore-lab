<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Khmer Store</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
    <div class="auth-layout">
        <div class="auth-card">
            <div class="auth-header">
                <a href="/" class="logo" style="justify-content: center; margin-bottom: 20px;">
                    <div class="logo-icon">KS</div>
                    <div class="logo-text">Khmer <span>Store</span></div>
                </a>
                <h1>Welcome Back</h1>
                <p>Login to your account</p>
            </div>

            <form id="loginForm">
                <div class="form-group">
                    <label class="form-label">Username</label>
                    <input type="text" id="username" class="form-input" required placeholder="Your username">
                </div>
                <div class="form-group">
                    <label class="form-label">Password</label>
                    <input type="password" id="password" class="form-input" required placeholder="Your password">
                </div>
                <button type="submit" class="btn btn-primary btn-block">Login</button>
            </form>

            <div id="response" class="response-box"></div>

            <div class="auth-footer">
                Don't have an account? <a href="/register">Register</a>
                <br>
                Need to verify? <a href="/verify">Verify Account</a>
            </div>
        </div>
    </div>

    <script>
        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const responseBox = document.getElementById('response');
            responseBox.style.display = 'block';
            responseBox.textContent = 'Logging in...';

            try {
                const res = await fetch('/api/login', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({
                        username: document.getElementById('username').value,
                        password: document.getElementById('password').value
                    })
                });
                const data = await res.json();
                responseBox.textContent = JSON.stringify(data, null, 2);

                if (data.success) {
                    setTimeout(() => {
                        window.location.href = '/account';
                    }, 1500);
                }
            } catch (err) {
                responseBox.textContent = 'Error: ' + err.message;
            }
        });
    </script>
</body>
</html>
