<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Verify Account - Khmer Store</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
    <div class="auth-layout">
        <div class="auth-card">
            <div class="auth-header">
                <a href="/" class="logo" style="justify-content: center; margin-bottom: 20px;">
                    <div class="logo-icon">KS</div>
                    <div class="logo-text">Khmer <span>Store</span></div>
                </a>
                <h1>Verify Account</h1>
                <p>Enter the code sent to your email</p>
            </div>

            <form id="verifyForm">
                <div class="form-group">
                    <label class="form-label">Username</label>
                    <input type="text" id="username" class="form-input" required placeholder="Your username">
                </div>
                <div class="form-group">
                    <label class="form-label">Verification Code</label>
                    <input type="text" id="code" class="form-input" required placeholder="6-digit code">
                </div>
                <button type="submit" class="btn btn-primary btn-block">Verify Account</button>
            </form>

            <div id="response" class="response-box"></div>

            <div class="auth-footer">
                Already verified? <a href="/login">Login</a>
            </div>
        </div>
    </div>

    <script>
        document.getElementById('verifyForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const responseBox = document.getElementById('response');
            responseBox.style.display = 'block';
            responseBox.textContent = 'Verifying...';

            try {
                const res = await fetch('/api/verify', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({
                        username: document.getElementById('username').value,
                        code: document.getElementById('code').value
                    })
                });
                const data = await res.json();
                responseBox.textContent = JSON.stringify(data, null, 2);

                if (data.success) {
                    setTimeout(() => {
                        window.location.href = '/login';
                    }, 2000);
                }
            } catch (err) {
                responseBox.textContent = 'Error: ' + err.message;
            }
        });
    </script>
</body>
</html>
